name: auto-fix lint issues & formatting

# On push to main (or manual trigger), run `npm run fix` on each workspace
# package and push any changes straight back to main.
#
# Fixable lint issues (import sorting, unused imports, curly braces, etc.) are
# auto-corrected on merge so PRs aren't blocked by them. The PR-time eslint
# check in typecheck.yml fails only when un-fixable errors remain.
#
# NOTE: secrets.GITHUB_TOKEN pushes do NOT trigger further workflow runs, so
# the direct push back to main cannot loop.
#
# ── Security model: two-job split ───────────────────────────────────────────
#
# The eslint process executes repo code (eslint.config.mjs, package.json
# scripts, installed plugins). To prevent a malicious PR from getting arbitrary
# code execution on a runner with push access, the work is split:
#
#   1. generate-patch (unprivileged, contents: read only)
#      Checks out, installs deps, runs eslint --fix, produces a .patch artifact.
#      Worst case: malicious code runs here on an ephemeral runner with zero
#      push permissions.
#
#   2. apply-patch (privileged, contents: write)
#      Checks out, downloads the patch artifact, applies it, pushes to
#      main directly (single-maintainer fork; no AUTOFIX_BOT_PAT needed).
#      This job never runs npm, never installs anything, never executes any
#      repo code. The only input it trusts is the patch artifact.
#      Skipped entirely when generate-patch reports no fixes (has-fixes != true).

# ── Why this no longer runs on push ─────────────────────────────────────────
#
# The premise in the header above — "single-maintainer fork; no branch
# protection" — stopped being true. The `Protect main branch` ruleset is active
# and requires `pull_request` plus linear history, with `bypass_actors` empty,
# so no direct push to main can succeed by anyone. Every run that found a fix
# died at the push:
#
#   error: GH013: Repository rule violations found for refs/heads/main.
#
# That is a standing red on main for a workflow that cannot do its job, which
# is worse than not running it: it trains people to ignore a red main.
#
# Restoring the automation means one of two things, and both are decisions
# rather than fixes. Granting the GitHub Actions app a ruleset bypass would let
# ANY workflow holding `contents: write` push to main, not just this one — the
# two-job split above protects this workflow, not the others. Going back to the
# PR + auto-merge flow needs `AUTOFIX_BOT_PAT`, since a GITHUB_TOKEN push
# triggers no workflows and the required checks would never run on the PR.
#
# Nothing is blocked in the meantime. The PR-time eslint check fails only on
# un-fixable errors, so the cost is that fixable ones — import order, unused
# imports, curly braces — accumulate until someone runs `npm run fix`.
# `workflow_dispatch` still produces the patch on demand.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: >-
          Push the patch to main. Fails while the ruleset stands — leave off to
          just produce the patch artifact and apply it locally.
        type: boolean
        default: false

permissions:
  contents: read # default; apply-patch job overrides to write

concurrency:
  group: ts-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-patch:
    name: Generate eslint --fix patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-fixes: ${{ steps.produce-patch.outputs.has-fixes }}
    # No permissions override → inherits workflow-level contents: read.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          npm i -g npm@12

      # --ignore-scripts: eslint only needs TS sources + eslint packages.
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts

      - name: npm run fix in all workspaces
        # continue-on-error: if un-fixable errors exist on main, we still want
        # to commit whatever fixes were applied. The PR-time check in
        # typecheck.yml is what blocks un-fixable errors from landing.
        continue-on-error: true
        run: npm run fix

      - name: Produce patch
        id: produce-patch
        run: |
          if git diff --quiet; then
            echo "No fixes needed."
            echo "has-fixes=false" >> "$GITHUB_OUTPUT"
            # Empty patch signals "nothing to do" to apply-patch.
            : > js-fix.patch
          else
            git diff > js-fix.patch
            echo "has-fixes=true" >> "$GITHUB_OUTPUT"
            echo "Patch size: $(wc -c < js-fix.patch) bytes"

            # Reject patches that touch anything outside JS/TS/JSON sources.
            # `npm run fix` should only ever modify those; anything else means
            # eslint/prettier or a plugin went rogue and we refuse to ship it.
            BAD=$(git diff --name-only | grep -vE '\.(js|cjs|mjs|ts|tsx|json)$' || true)
            if [ -n "$BAD" ]; then
              echo "::error::Refusing to upload patch — touches disallowed files:"
              echo "$BAD"
              exit 1
            fi
          fi

      - name: Upload patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-fix-patch
          path: js-fix.patch
          retention-days: 1
          include-hidden-files: true

  apply-patch:
    name: Apply patch
    needs: generate-patch
    # Skip entirely when generate-patch found no fixes — saves a runner,
    # avoids a redundant checkout/download, and keeps the job graph honest.
    #
    # Also gated on the `apply` input, because the push below cannot succeed
    # while the `Protect main branch` ruleset stands (see the note on `on:`).
    # A dispatch therefore leaves the patch as an artifact by default rather
    # than ending in a red run; opting in is for once that is resolved.
    if: needs.generate-patch.outputs.has-fixes == 'true' && inputs.apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # needed to push the fix back to main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: js-fix-patch
          # ${{ runner.temp }} expands in with: params (shell-style $VAR does not).
          # download-artifact's path is a *directory* — the artifact's js-fix.patch
          # file lands inside it, so $RUNNER_TEMP/js-fix.patch resolves correctly
          # in the run step below.
          path: ${{ runner.temp }}

      - name: Apply patch and push to main
        run: |
          set -euo pipefail

          # Empty patch = nothing to do.
          if [ ! -s "$RUNNER_TEMP/js-fix.patch" ]; then
            echo "Patch is empty. No fixes to apply."
            exit 0
          fi

          # Apply the patch produced by the unprivileged job.
          git apply --check "$RUNNER_TEMP/js-fix.patch" || {
            echo "::error::Patch does not apply cleanly. Branch may have moved."
            exit 1
          }
          git apply "$RUNNER_TEMP/js-fix.patch"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fmt(js): \`npm run fix\` on merge"

          # Push the fix straight back to main. This fork is single-maintainer
          # with no branch protection, and the upstream PR + auto-merge flow
          # required an AUTOFIX_BOT_PAT secret this repo doesn't have — every
          # run that found fixes failed at PR creation. GITHUB_TOKEN pushes do
          # not retrigger workflows, so this cannot loop. If main moved while
          # we worked, rebase once and retry; on conflict just give up — the
          # next push re-runs the whole workflow anyway.
          git fetch origin main
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
